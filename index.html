<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>全球稀土產量地圖</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
    }
    body {
      margin: 0;
      padding: 24px;
      background: #f7f7f7;
      color: #222;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      margin-top: 0;
      font-size: 28px;
      letter-spacing: 0.02em;
    }
    p.description {
      margin-top: 6px;
      line-height: 1.6;
      color: #444;
    }
    #map-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      padding: 20px;
      margin-top: 16px;
    }
    .subtitle {
      font-weight: 600;
      margin-bottom: 12px;
    }
    .tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(34, 34, 34, 0.85);
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.4;
      opacity: 0;
      transform: translate(-50%, -120%);
      transition: opacity 0.15s ease;
      white-space: nowrap;
    }
    .legend {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #555;
      margin-top: 6px;
      margin-bottom: 14px;
    }
    .legend-bar {
      flex: 1;
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(90deg, #f7fbff, #6baed6, #08306b);
    }
    .legend-labels {
      display: flex;
      justify-content: space-between;
      font-variant-numeric: tabular-nums;
      width: 100%;
    }
    .note {
      margin-top: 10px;
      color: #555;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>2024 年全球稀土產量地圖</h1>
    <p class="description">滑鼠移到地圖上的國家即可查看該國的稀土產量（公噸）。顏色越深表示產量越高，資料來源為本頁的 <code>data.json</code>。</p>
    <div id="map-container">
      <div class="subtitle">主要產地分布</div>
      <div id="map"></div>
      <div class="legend" aria-hidden="true">
        <span>產量（公噸）</span>
        <div class="legend-bar"></div>
      </div>
      <div class="legend-labels">
        <span id="legend-min">最少</span>
        <span id="legend-max">最多</span>
      </div>
      <p class="note">僅顯示有資料的國家，其餘地區以淡色呈現。</p>
    </div>
  </main>

  <div class="tooltip" role="status" aria-live="polite" id="tooltip"></div>

  <script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
    import {feature, mesh} from "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm";

    const width = 980;
    const height = 540;
    const mapContainer = d3.select("#map");
    const tooltip = d3.select("#tooltip");

    const svg = mapContainer.append("svg")
      .attr("viewBox", [0, 0, width, height])
      .attr("aria-label", "2024 年全球稀土產量地圖")
      .style("max-width", "100%")
      .style("height", "auto");

    const projection = d3.geoEqualEarth().fitExtent([[10, 20], [width - 10, height - 20]], {type: "Sphere"});
    const path = d3.geoPath(projection);

    const renameMap = new Map([
      ["United States", "United States of America"],
    ]);

    Promise.all([
      fetch("./data.json").then((r) => r.json()),
      fetch("./files/105124169f32536c2c86c7d6a237673814f21444a667f2cb8c4e2b3f7b3cfae56fac5346a6ac7fd5cc02b63fcda1b08ac4e86a7c86896e5eeb37b51ccceb8f69.json").then((r) => r.json())
    ]).then(([rawData, world]) => {
      const records = rawData.map((d) => {
        const mappedName = renameMap.get(d.country) ?? d.country;
        return {
          ...d,
          mappedName
        };
      });

      const valueMap = new Map(records.map((d) => [d.mappedName, d.production]));
      const displayNameMap = new Map(records.map((d) => [d.mappedName, d.country]));

      const countries = feature(world, world.objects.countries);
      const borders = mesh(world, world.objects.countries, (a, b) => a !== b);

      const [min, max] = d3.extent(records, (d) => d.production);
      const color = d3.scaleSequential()
        .domain([min || 0, max || 1])
        .interpolator(d3.interpolateBlues);

      d3.select("#legend-min").text(min?.toLocaleString("zh-Hant") ?? "0");
      d3.select("#legend-max").text(max?.toLocaleString("zh-Hant") ?? "0");

      svg.append("path")
        .datum({type: "Sphere"})
        .attr("fill", "#f8fbff")
        .attr("stroke", "#ccc")
        .attr("d", path);

      svg.append("g")
        .selectAll("path")
        .data(countries.features)
        .join("path")
          .attr("fill", (d) => {
            const value = valueMap.get(d.properties.name);
            return value != null ? color(value) : "#e6e6e6";
          })
          .attr("stroke", "white")
          .attr("stroke-width", 0.5)
          .attr("d", path)
          .on("mousemove", (event, d) => {
            const value = valueMap.get(d.properties.name);
            const name = displayNameMap.get(d.properties.name) ?? d.properties.name;
            tooltip
              .style("opacity", 1)
              .style("left", `${event.pageX}px`)
              .style("top", `${event.pageY}px`)
              .html(`<div><strong>${name}</strong></div><div>產量：${value != null ? value.toLocaleString("zh-Hant") + ' 公噸' : '無資料'}</div>`);
          })
          .on("mouseout", () => tooltip.style("opacity", 0));

      svg.append("path")
        .datum(borders)
        .attr("fill", "none")
        .attr("stroke", "white")
        .attr("stroke-width", 0.6)
        .attr("d", path);
    });
  </script>
</body>
</html>
